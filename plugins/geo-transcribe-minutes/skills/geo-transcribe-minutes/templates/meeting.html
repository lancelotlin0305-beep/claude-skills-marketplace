<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- meeting.title --></title>
<!-- 內容一律取自 minutes.json;null 欄位顯示「—」或整塊省略,不得腦補。
     區塊資料為空(陣列 [])時整個 section 連標題一起拿掉。 -->
<style>
:root{
  --ground:#EFF1F4; --surface:#FFFFFF; --sunk:#E4E8ED;
  --ink:#131A24; --muted:#5A6674; --faint:#8794A3; --rule:#CFD6DE;
  --accent:#1F4E79; --accent-soft:rgba(31,78,121,.09);
  --flag:#A32C2C; --flag-soft:rgba(163,44,44,.09);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1319; --surface:#161D26; --sunk:#0A0E13;
    --ink:#DDE3EA; --muted:#8B97A6; --faint:#66727F; --rule:#28323E;
    --accent:#7FB2E0; --accent-soft:rgba(127,178,224,.12);
    --flag:#E08A7E; --flag-soft:rgba(224,138,126,.12);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1319; --surface:#161D26; --sunk:#0A0E13;
  --ink:#DDE3EA; --muted:#8B97A6; --faint:#66727F; --rule:#28323E;
  --accent:#7FB2E0; --accent-soft:rgba(127,178,224,.12);
  --flag:#E08A7E; --flag-soft:rgba(224,138,126,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.sheet{max-width:52rem;margin:0 auto;padding:0 1.5rem 5rem}
.lbl{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
     color:var(--faint);margin:0 0 .7rem}
.hd{padding:3.5rem 0 1.75rem;border-bottom:2px solid var(--ink)}
.hd h1{font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.2;letter-spacing:-.02em;
       font-weight:800;margin:0 0 1.25rem;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem 2rem;margin:0}
.facts div{display:flex;gap:.6rem;font-size:.88rem}
.facts dt{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
          color:var(--faint);min-width:3.5rem;padding-top:.22rem}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.who{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.5rem}
.chip{font-size:.82rem;padding:.18rem .6rem;border:1px solid var(--rule);border-radius:2px;
      background:var(--surface)}
.chip s{text-decoration:line-through;color:var(--faint)}
.chip em{font-style:normal;color:var(--faint);font-size:.9em}
.sec{padding-top:3rem}
.sec h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin:0 0 1.1rem;
        padding-bottom:.5rem;border-bottom:1px solid var(--rule)}
.tldr{margin:0;padding-left:1.3rem}
.tldr li{margin:.4rem 0}
.ts{font-family:var(--mono);font-size:.76rem;color:var(--faint);white-space:nowrap;
    font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin:0 0 1rem}
table{border-collapse:collapse;width:100%;min-width:34rem;font-size:.9rem}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
         color:var(--faint);font-weight:600;border-bottom:1px solid var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.id{font-family:var(--mono);font-size:.76rem;color:var(--accent);white-space:nowrap;
    font-variant-numeric:tabular-nums}
.due{font-family:var(--mono);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.own{white-space:nowrap;font-weight:600}
tr.blk td{background:var(--flag-soft)}
tr.blk .id{color:var(--flag)}
.tag{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
     color:var(--flag);border:1px solid var(--flag);border-radius:2px;padding:.05rem .35rem;
     white-space:nowrap}
.item{border-left:2px solid var(--rule);padding:0 0 0 1.2rem;margin:0 0 2rem}
.item h3{font-size:1.02rem;font-weight:700;margin:0 0 .5rem}
.item h3 span{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin-right:.5rem}
.item p{margin:0 0 .8rem;color:var(--muted);max-width:38rem}
.opts{display:grid;gap:.5rem;margin:0 0 .9rem}
.opt{background:var(--sunk);border-radius:3px;padding:.6rem .8rem;font-size:.86rem}
.opt b{display:block;margin-bottom:.15rem}
.opt span{color:var(--muted)}
.dec{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 3px 3px 0;
     padding:.75rem 1rem;font-size:.92rem}
.dec .lbl{color:var(--accent);margin:0 0 .3rem}
.dec p{margin:0;color:var(--ink);max-width:none}
.dec .why{margin-top:.4rem;color:var(--muted);font-size:.88rem}
.nodec{border-left:3px solid var(--flag);background:var(--flag-soft);border-radius:0 3px 3px 0;
       padding:.75rem 1rem;font-size:.92rem}
.nodec .lbl{color:var(--flag);margin:0}
.grid{display:grid;gap:1rem}
@media(min-width:44rem){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:.9rem 1.1rem}
.card .lbl{margin:0 0 .35rem}
.card p{margin:0;font-size:.9rem}
.card .sub{color:var(--muted);font-size:.83rem;margin-top:.35rem}
svg{width:100%;height:auto;display:block}
details{margin:8px 0}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.speech{margin:10px 0}
.speech .who-n{font-weight:600;color:var(--accent);margin-right:6px}
.foot{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid var(--rule);
      font-size:.8rem;color:var(--faint)}
.foot p{margin:0 0 .4rem;max-width:40rem}
@media print{
  body{background:#fff;color:#000;font-size:10.5pt}
  .sheet{max-width:none;padding:0}
  .sec{padding-top:1.5rem;break-inside:avoid}
  .item{break-inside:avoid}
  tr.blk td{background:transparent}
  details{display:block}
}
</style>
</head>
<body>
<div class="sheet">

<header class="hd">
  <p class="lbl">會議紀錄</p>
  <h1><!-- meeting.title --></h1>
  <dl class="facts">
    <div><dt>日期</dt><dd><!-- meeting.date --></dd></div>
    <div><dt>時間</dt><dd><!-- meeting.time 或 — --></dd></div>
    <div><dt>地點</dt><dd><!-- meeting.location 或 — --></dd></div>
    <div><dt>主持</dt><dd><!-- meeting.chair 或 — --></dd></div>
  </dl>
  <div class="who">
    <!-- 每位 attendee 一個 chip;role 有值放 <em>;請假者:
    <span class="chip"><s>姓名</s> <em>請假</em></span> -->
    <span class="chip">姓名 <em>職稱</em></span>
  </div>
</header>

<section class="sec">
  <h2>結論摘要</h2>
  <ul class="tldr">
    <!-- tldr[]:<li>…… <span class="ts">hh:mm:ss</span></li> -->
  </ul>
</section>

<section class="sec">
  <h2>議程時間軸</h2>
  <!-- agenda_items 依 ts 畫橫向時間軸:x=起始秒/總秒*1000,寬=至下一議題;
       段色輪用 #1F4E79 #059669 #B45309 #6D28D9 #0E7490(加 opacity .8,雙主題可讀)。
       文字用 style="fill:var(--ink)" / var(--muted) 讓深色模式跟著變。
       段數>8 或 ts 多為 null 時,整節刪除。 -->
  <svg viewBox="0 0 1000 90" role="img" aria-label="議程時間軸">
    <rect x="0" y="26" width="1000" height="24" rx="4" style="fill:var(--sunk)"/>
    <!-- 每議題:
    <rect x="0" y="26" width="250" height="24" rx="4" fill="#1F4E79" opacity=".8"/>
    <text x="4" y="18" font-size="14" style="fill:var(--ink)">01 議題名</text>
    <text x="4" y="66" font-size="12" style="fill:var(--muted)">00:00–12:30</text> -->
  </svg>
</section>

<!-- decision.made=true 的議題彙整;一筆都沒有就整節刪 -->
<section class="sec">
  <h2>決議摘要</h2>
  <div class="tw"><table>
    <thead><tr><th>編號</th><th>議題</th><th>拍板內容</th><th>拍板者</th><th>出處</th></tr></thead>
    <tbody>
      <!-- <tr><td class="id">D01</td><td>議題</td><td>拍板內容</td>
           <td class="own">姓名或—</td><td class="ts">hh:mm:ss</td></tr> -->
    </tbody>
  </table></div>
</section>

<!-- action_items:先卡關後一般,再依 due 早→晚;owner null→待指派;
     due null→顯示 due_raw 原話(淡色)或 — -->
<section class="sec">
  <h2>行動項</h2>
  <div class="tw"><table>
    <thead><tr><th>編號</th><th>事項</th><th>負責人</th><th>期限</th><th>關聯議題</th><th>出處</th></tr></thead>
    <tbody>
      <!-- 一般:<tr><td class="id">A01</td><td>事項</td><td class="own">姓名</td>
             <td class="due">YYYY-MM-DD</td><td>議題</td><td class="ts">hh:mm:ss</td></tr>
           卡關:<tr class="blk"><td class="id">A02</td><td>事項 <span class="tag">卡關</span></td>… -->
    </tbody>
  </table></div>
</section>

<section class="sec">
  <h2>議題討論</h2>
  <!-- 每個 agenda_item 一個 article -->
  <article class="item">
    <h3><span>01</span>議題名 <span class="ts">hh:mm:ss</span></h3>
    <p><!-- summary,三句以內 --></p>
    <div class="opts">
      <!-- options_considered[](沒有就刪掉 .opts):
      <div class="opt"><b>方案名</b><span>優點:…</span><br><span>疑慮:…</span></div> -->
    </div>
    <!-- 拍板:
    <div class="dec"><p class="lbl">決議</p><p>拍板內容</p>
      <p class="why">理由:…(rationale 有值才放)</p></div>
    未拍板:
    <div class="nodec"><p class="lbl">本次未拍板</p></div> -->
  </article>
</section>

<!-- 以下三節:對應陣列為空就整節刪 -->
<section class="sec">
  <h2>風險</h2>
  <div class="grid">
    <!-- <div class="card"><p>風險描述</p>
         <p class="sub">觸發條件:…</p><p class="sub">影響:…</p><p class="sub">負責人:…</p></div> -->
  </div>
</section>

<section class="sec">
  <h2>未解問題</h2>
  <div class="grid">
    <!-- <div class="card"><p>問題 <span class="ts">hh:mm:ss</span></p>
         <p class="sub">提出者:…</p><p class="sub">後續:…</p></div> -->
  </div>
</section>

<section class="sec">
  <h2>延後事項</h2>
  <div class="grid">
    <!-- <div class="card"><p>事項</p>
         <p class="sub">原因:…</p><p class="sub">重啟時機:…</p></div> -->
  </div>
</section>

<section class="sec">
  <h2>附錄:逐字稿(順稿版)</h2>
  <details>
    <summary>展開全文</summary>
    <!-- <p class="speech"><span class="ts">hh:mm:ss</span>
         <span class="who-n">發言者:</span>內容…</p> -->
  </details>
</section>

<footer class="foot">
  <p>本紀錄依會議錄音轉錄後結構化萃取產生。所有欄位僅取自來源內容,來源未明確說明者留白,未經推測補齊。核對後如有出入,請以錄音/逐字稿原件為準。</p>
  <p>來源:<!-- 檔名 --> ・引擎:<!-- engine --> ・產出:<!-- YYYY/MM/DD --> ・v1</p>
  <p>待確認:<!-- [?] 與 [聽不清] 清單,無則寫「無」 --></p>
</footer>

</div>
</body>
</html>
